name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/jig
      - name: Keep workflow.md under the 10,000-character hook output cap
        run: test "$(wc -c < plugins/jig/hooks/workflow.md)" -lt 10000
